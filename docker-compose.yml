x-ros-env: &ros-env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  # DDS discovery stays on lo (unicast); file is baked into edge-ros-base.
  CYCLONEDDS_URI: file:///etc/cc/cyclonedds.xml

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '2'

# Serial adapters only: ttyAMA/ttyS* (204), ttyUSB (188), ttyACM (166). Jetson: add the ttyTHS major
# (`ls -l /dev/ttyTHS1` -> `c <major>:* rmw`). /dev stays mounted so hot-plugged UARTs are openable.
x-uart-access: &uart-access
  device_cgroup_rules:
    - 'c 204:* rmw'
    - 'c 188:* rmw'
    - 'c 166:* rmw'

services:
  # 1. Core MAVLink Multiplexer & Router (FC <-> GCS safety path; independent of DDS)
  edge-router:
    build:
      context: .
      dockerfile: src/modules/mavlink_router/Dockerfile
    image: edge-router:latest
    container_name: edge-router
    pull_policy: never
    restart: always
    network_mode: host
    cpus: 0.5
    mem_limit: 64m
    <<: *uart-access
    environment:
      <<: *ros-env
      GCS_IP: ${GCS_IP:-}
      TCP_SERVER_PORT: ${TCP_SERVER_PORT:-5760}
    volumes:
      - /dev:/dev:ro
      - /run/drone:/run/drone:rw
      - ./config:/app/config:ro
      - mavlink-logs:/var/log/mavlink-router
      - /etc/localtime:/etc/localtime:ro
    logging: *logging

  # 2. Central Companion Hub (Mavlink + ConfigManager + LoadMon nodes). No UART: the router owns the serial ports.
  edge-agent:
    build:
      context: .
      dockerfile: platforms/linux/edge_agent/Dockerfile
    image: edge-agent:latest
    container_name: edge-agent
    pull_policy: never
    restart: always
    network_mode: host
    cpus: 0.5
    mem_limit: 128m
    working_dir: /app
    depends_on:
      edge-router:
        condition: service_started
        required: true
    volumes:
      - /dev:/dev:ro
      - /run/drone:/run/drone:rw
      - ./config:/app/config:rw
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      <<: *ros-env
    logging: *logging

  # 3. Network Manager (WiFi AP/Client, Ethernet, mDNS)
  edge-network:
    build:
      context: .
      dockerfile: src/modules/networking/Dockerfile
    image: edge-network:latest
    container_name: edge-network
    pull_policy: never
    restart: always
    network_mode: host
    init: true
    cpus: 0.3
    mem_limit: 96m
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      <<: *ros-env
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-drone}
    volumes:
      - /run/drone:/run/drone:rw
      - ./config:/app/config:ro
      - ./src/modules/networking/dnsmasq.conf:/etc/dnsmasq.d/drone.conf:ro
      - ./src/modules/networking/entrypoint.sh:/app/entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    logging: *logging

  # 4. Camera: the only owner of the capture device. FPV (RTSP via MediaMTX) + AI branch into the frame_pool shm ring.
  edge-camera:
    build:
      context: .
      dockerfile: src/modules/camera_streamer/Dockerfile
    image: edge-camera:latest
    container_name: edge-camera
    pull_policy: never
    restart: always
    network_mode: host
    init: true
    cpus: 1.0
    mem_limit: 192m
    cap_add:
      - SYS_NICE
    device_cgroup_rules:
      - 'c 81:* rmw'      # v4l2 (/dev/video*)
      - 'c 235:* rmw'     # media controller (/dev/media*)
      - 'c 189:* rmw'     # USB bus (/dev/bus/usb/*)
      - 'c 252:* rmw'     # DMA heap (/dev/dma_heap/*)
    environment:
      <<: *ros-env
    command: ["--ros-args", "--params-file", "/app/config/camera_streamer.yaml"]
    volumes:
      - /dev:/dev
      - frame_pool:/run/frame_pool:rw
      - type: bind
        source: ./src/modules/camera_streamer/config/camera_streamer.yaml
        target: /app/config/camera_streamer.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./src/drivers/camera/config
        target: /app/config/cameras
        read_only: true
        bind:
          create_host_path: false
      - ./src/modules/camera_streamer/mediamtx.yml:/app/mediamtx.yml:ro
      - /etc/localtime:/etc/localtime:ro
    logging: *logging

  # 5. AI Vision (YOLO) on frames from the shm ring, published to MediaMTX /yolo
  edge-vision:
    build:
      context: .
      dockerfile: src/modules/vision/Dockerfile
    profiles:
      - vision
    init: true
    cpus: ${VISION_CPUS:-1.5}
    mem_limit: ${VISION_MEMORY:-512m}
    stop_grace_period: 20s
    image: edge-vision:latest
    container_name: edge-vision
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    depends_on:
      edge-camera:
        condition: service_started
    environment:
      <<: *ros-env
    command: ["--ros-args", "--params-file", "/app/config/vision.yaml"]
    volumes:
      - frame_pool:/run/frame_pool:ro
      - ./src/modules/vision/config:/app/config:ro
      - ./src/drivers/camera/config:/app/config/cameras:ro
      - ./src/modules/vision/entrypoint.sh:/app/entrypoint.sh:ro
      - ./src/modules/vision/yolo26n.pt:/app/models/yolo26n.pt:ro
      - /etc/localtime:/etc/localtime:ro
    logging: *logging

  # 6. Decoupled Vision v1: RTSP drives video while FramePool independently drives YOLO inference.
  # Run either edge-vision OR edge-vision-v1: both own ROS node `vision` and MediaMTX path /yolo.
  edge-vision-v1:
    build:
      context: .
      dockerfile: src/modules/vision_v1/Dockerfile
    profiles:
      - vision-v1
    init: true
    cpus: ${VISION_V1_CPUS:-1.5}
    mem_limit: ${VISION_V1_MEMORY:-512m}
    stop_grace_period: 20s
    image: edge-vision-v1:latest
    container_name: edge-vision-v1
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    depends_on:
      edge-camera:
        condition: service_started
    environment:
      <<: *ros-env
    command: ["--ros-args", "--params-file", "/app/config/vision_v1.yaml"]
    volumes:
      - frame_pool:/run/frame_pool:ro
      - type: bind
        source: ./src/modules/vision_v1/config/vision_v1.yaml
        target: /app/config/vision_v1.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./src/drivers/camera/config
        target: /app/config/cameras
        read_only: true
        bind:
          create_host_path: false
      - ./src/modules/vision/yolo26n.pt:/app/models/yolo26n.pt:ro
      - /etc/localtime:/etc/localtime:ro
    logging: *logging

volumes:
  mavlink-logs:
    driver: local
  # Shared-memory frame ring (camera writes, vision reads). Fresh on every host boot.
  frame_pool:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=32m
