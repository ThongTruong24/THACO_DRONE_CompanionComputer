# ============================================================
# Dnsmasq Configuration for Drone Networking (Pi 5)
# Cung cấp DHCP & Local DNS cho cổng WiFi AP uap0
# ============================================================

# Lắng nghe cổng 53 trên IP của interface uap0 với chế độ bind-dynamic
# để không xung đột với systemd-resolved của host và chấp nhận interface động
port=53
listen-address=192.168.10.1
bind-dynamic
interface=uap0
except-interface=lo
except-interface=wlan0
except-interface=eth0

# Bản ghi DNS tĩnh cho Drone
address=/drone.local/192.168.10.1
address=/drone.lan/192.168.10.1
address=/thong.local/192.168.10.1

# ------------------------------------------------------------
# 1. Cổng WiFi AP uap0 (Hotspot AP_DRONE cho QGC Laptop)
# ------------------------------------------------------------
dhcp-range=interface:uap0,192.168.10.10,192.168.10.50,255.255.255.0,24h
dhcp-option=interface:uap0,3,192.168.10.1
# DNS cấp cho Client: 192.168.10.1 (Drone Local DNS) và 1.1.1.1 (Internet Fallback)
dhcp-option=interface:uap0,6,192.168.10.1,1.1.1.1

# ------------------------------------------------------------
# 2. Cổng Cáp Mạng eth0 (SIYI Air Unit & Mạng phòng Lab)
# CHÚ Ý: KHÔNG cấp DHCP trên eth0 để tránh biến Pi thành Rogue DHCP Server
# SIYI Air Unit dùng IP tĩnh (192.168.144.20/24), không cần cấp DHCP.
# ------------------------------------------------------------
