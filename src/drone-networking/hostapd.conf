# ============================================================
# Hostapd Configuration for Drone Access Point (AP_DRONE)
# Interface ảo uap0 được tạo tự động bởi AP-STA Concurrency
# ============================================================

interface=uap0
driver=nl80211
ssid=AP_DRONE
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Bảo mật WPA2-PSK
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Đảm bảo phát sóng tin cậy
auth_algs=1
ignore_broadcast_ssid=0
