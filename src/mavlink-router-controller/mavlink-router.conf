[General]
ReportStats = true
MavlinkDialect = ardupilotmega
DebugLogLevel = info
TcpServerPort = 5760

# ============================================================
# 1. Flight Controller (Cube Orange Plus / ArduPilot / PX4)
# ============================================================
[UartEndpoint FlightController]
Device = ${DRONE_SERIAL_PORT}
Baud = ${DRONE_BAUD_RATE}
FlowControl = false

# ============================================================
# 2. UDP Server hai chiều cho QGroundControl (Hỗ trợ toàn bộ WiFi & LAN)
# Mode Server lắng nghe trên 0.0.0.0:14550:
# Tự động tiếp nhận và phản hồi hai chiều cho bất kỳ GCS nào kết nối
# qua WiFi AP, WiFi STA, Ethernet cáp hoặc Tailscale.
# ============================================================
[UdpEndpoint QGC_UDP_Server]
Mode = Server
Address = 0.0.0.0
Port = 14550

# ============================================================
# 3. Local companion channels (MAVROS & Internal Tools)
# ============================================================
[UdpEndpoint MAVROS_Companion]
Mode = Server
Address = 127.0.0.1
Port = 14541

[UdpEndpoint Internal_Companion]
Mode = Server
Address = 127.0.0.1
Port = 14540

# ============================================================
# 4. Companion Linux OS Configuration Agent (cc-config-agent)
# ============================================================
[UdpEndpoint ConfigAgent]
Mode = Server
Address = 127.0.0.1
Port = 14600
