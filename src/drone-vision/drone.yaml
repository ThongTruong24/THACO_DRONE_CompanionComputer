serial_port: /dev/ttyUSB0
baud_rate: 57600
camera_device: /dev/video0
ros_domain_id: 0

mavlink:
  system_id: 1
  component_id: 191   # MAV_COMP_ID_ONBOARD_COMPUTER

logging:
  level: INFO
  format: json
  output: stdout
  file: /var/log/drone/drone.log

camera:
  rotation: 180

# YOLO mode: nhan frame tu RealSense truc tiep (co depth) hoac fallback RTSP
mode: yolo
yolo:
  model: /app/models/yolo26n.pt
  # "realsense" = doc truc tiep tu D435i USB (co depth), "rtsp" = fallback RTSP (khong co depth)
  input_source: rtsp
  input_url: rtsp://127.0.0.1:8554/camera   # Dung khi input_source=rtsp
  output_url: rtmp://127.0.0.1:1935/yolo
  width: 640
  height: 360
  fps: 20
  inference_fps: 5
  imgsz: 320
  confidence: 0.35
  threads: 2
  bitrate_kbps: 1000
  stale_seconds: 2
  reconnect_seconds: 1

# Cau hinh Depth Estimation (chi dung khi input_source=realsense)
depth:
  enabled: false
  width: 640
  height: 480
  fps: 6
  min_distance_m: 0.3
  max_distance_m: 10.0
  sample_radius: 5
  mavlink_publish: false
  unit: m

# Future ROS 2 object-localization contract. Keep disabled until camera
# publishes synchronized RGB, aligned metric depth and CameraInfo.
object_localization:
  enabled: false
  color_topic: /camera/color/image_raw
  aligned_depth_topic: /camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/color/camera_info
  detections_2d_topic: /vision/detections_2d
  objects_3d_topic: /vision/objects_3d
  ranges_topic: /vision/object_ranges
  camera_frame: camera_color_optical_frame
  base_frame: base_link
  map_frame: map
  sync_slop_seconds: 0.08
  center_fraction: 0.5
  minimum_valid_samples: 12
  minimum_valid_ratio: 0.35
  maximum_depth_mad_m: 0.25
  max_depth_age_ms: 150
