<rect width="1600" height="960" fill="#0b1020"/><text x="55" y="58" class="title">Drone Edge — Container &amp; Telemetry Architecture</text><text x="55" y="86" class="sub">Versioned development map · Raspberry Pi 5 host networking</text>
<rect x="40" y="120" width="1520" height="790" rx="24" fill="#101a31" stroke="#33456f" stroke-width="2"/>
<text x="70" y="155" class="label">Raspberry Pi 5 · host network</text>
