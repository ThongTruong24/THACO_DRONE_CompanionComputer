<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<style>text{font-family:Arial,sans-serif;fill:#eaf0ff}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#aebbd5}.box{stroke-width:2;rx:16}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#cbd6ee}.arrow{stroke:#9fb8ff;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#7fe3c0;stroke-dasharray:8 6}</style>
